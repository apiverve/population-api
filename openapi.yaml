openapi: 3.0.4
info:
  title: Population Data
  description: >-
    A country population and demographic data API. Look up any country by ISO
    code to get its population data, with total population, growth rate,
    density, urban/rural breakdown, and life expectancy on paid plans.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/population:
    get:
      summary: Population Data
      description: >-
        Get population data for a specific country. Returns latest data by
        default, or data for a specific year if specified.
      operationId: population
      parameters:
        - name: country
          in: query
          schema:
            type: string
          required: true
          description: ISO 2 or 3-letter country code (e.g., US, USA, GB, GBR)
          example: US
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Specific year to retrieve data for (1960-present). Returns latest if
            not specified.
          example: 2023
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: US
                  countryName: United States
                  year: 2025
                  count: 1
                  historical:
                    - year: 2025
                      population: 341784857
                      populationFormatted: 341.78 million
                      growthRate: 0.52
                      urbanPercent: 80.19
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  country: US
